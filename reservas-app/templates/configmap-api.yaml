apiVersion: v1
kind: ConfigMap
metadata:
  name: reservas-api-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reservas-app.labels" . | nindent 4 }}
data:
  DB_HOST: "reservas-db"
  DB_PORT: {{ .Values.db.port | quote }}
  DB_NAME: {{ .Values.db.name | quote }}
  PORT: {{ .Values.api.port | quote }}
  SEED_DEMO: {{ .Values.api.seedDemo | quote }}

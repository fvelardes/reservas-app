apiVersion: v1
kind: Secret
metadata:
  name: reservas-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reservas-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_USER: {{ .Values.db.credentials.user | quote }}
  MYSQL_PASSWORD: {{ .Values.db.credentials.password | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.db.credentials.rootPassword | quote }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reservas-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: reservas-frontend
  template:
    metadata:
      labels:
        app: reservas-frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-frontend.yaml") . | sha256sum }}
    spec:
      containers:
        - name: reservas-frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: reservas-frontend-config

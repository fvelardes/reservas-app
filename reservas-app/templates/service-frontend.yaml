apiVersion: v1
kind: Service
metadata:
  name: reservas-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reservas-app.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: reservas-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: 8080
      nodePort: {{ .Values.frontend.nodePort }}

apiVersion: v1
kind: Service
metadata:
  name: reservas-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reservas-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: reservas-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}

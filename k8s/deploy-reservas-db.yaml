apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-db
  namespace: reservas-app
spec:
  replicas: 1                
  strategy:
    type: Recreate           
  selector:
    matchLabels:
      app: reservas-db
  template:                  
    metadata:
      labels:
        app: reservas-db     
    spec:
      containers:
        - name: reservas-db
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "reservas_root_pass"
            - name: MYSQL_DATABASE
              value: "reservasdb"
            - name: MYSQL_USER
              value: "reservas_user"
            - name: MYSQL_PASSWORD
              value: "reservas_pass"

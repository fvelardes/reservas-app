apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-api
  namespace: reservas-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reservas-api
  template:
    metadata:
      labels:
        app: reservas-api
    spec:
      containers:
        - name: reservas-api   
          image: fvelardes/reservas-api:v1
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "reservas-db"   
            - name: DB_USER
              value: "reservas_user"
            - name: DB_PASSWORD
              value: "reservas_pass"
            - name: DB_NAME
              value: "reservasdb"

# SOLO DEPURACIÓN: expone la API hacia afuera en :30501.
# No forma parte del chart de la semana 8.
apiVersion: v1
kind: Service
metadata:
  name: reservas-api-nodeport
  namespace: reservas-app
spec:
  type: NodePort
  selector:
    app: reservas-api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30501

apiVersion: v1
kind: Pod
metadata:
  name: preparar-volumen
  namespace: reservas-app
spec:
  restartPolicy: Never
  containers:
    - name: preparar
      image: busybox
      command: ["sh", "-c", "echo previo > /datos/viejo.txt && ls -la /datos"]
      volumeMounts:
        - name: datos
          mountPath: /datos
  volumes:
    - name: datos
      persistentVolumeClaim:
        claimName: reservas-db-pvc

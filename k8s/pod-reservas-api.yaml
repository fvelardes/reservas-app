apiVersion: v1
kind: Pod
metadata:
  name: reservas-api
  namespace: reservas-app
  labels:
    app: reservas-api
spec:
  containers:
  - image: fvelardes/reservas-api:v1
    name: reservas-api
    ports:
      - containerPort: 3000
    env:
      - name: DB_HOST
        value: "reservas-db"
      - name: DB_USER
        value: "reservas_user"
      - name: DB_PASSWORD
        value: "reservas_pass"
      - name: DB_NAME
        value: "reservasdb"
  dnsPolicy: ClusterFirst
  restartPolicy: Always

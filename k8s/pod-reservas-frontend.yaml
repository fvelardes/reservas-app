apiVersion: v1
kind: Pod
metadata:
  name: reservas-frontend
  namespace: reservas-app
  labels:
    app: reservas-frontend
spec:
  containers:
  - image: fvelardes/reservas-frontend:v1
    name: reservas-frontend
    ports:
      - containerPort: 8080
  dnsPolicy: ClusterFirst
  restartPolicy: Always
